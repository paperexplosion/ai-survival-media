name: content-db-sync
# blog-posts-data.json が更新されるたび（直接公開でもPRマージでも）、新着記事をNotionのコンテンツ管理DBに自動登録する。
on:
  push:
    branches: [main]
    paths:
      - "src/lib/blog-posts-data.json"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: content-db-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Notionコンテンツ管理DBへ新着を同期
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 scripts/sync_notion_content_db.py
      - name: 同期状態をコミット
        run: |
          git config user.name "ai-survival-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add state/notion_synced_slugs.json
          git diff --cached --quiet || (git commit -m "chore: Notionコンテンツ管理DBの同期状態を更新" && git push)
