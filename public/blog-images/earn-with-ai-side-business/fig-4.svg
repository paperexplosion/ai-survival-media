<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 328" width="800" height="328" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" role="img" aria-label="「月5万」の読み方：単価表と実収益の違い"><rect x="1" y="1" width="798" height="326" rx="16" fill="#111c33" stroke="#2b3b5c" stroke-width="2"/><text x="32" y="46" font-size="21" fill="#e2e8f0" font-weight="bold" text-anchor="start">「月5万」の読み方：単価表と実収益の違い</text><rect x="32" y="58" width="56" height="4" rx="2" fill="#22d3ee"/><rect x="32" y="90" width="352" height="46" rx="10" fill="#22d3ee"/><text x="208" y="121" font-size="19" fill="#111c33" font-weight="bold" text-anchor="middle">記事に示された数字</text><circle cx="42" cy="163" r="4" fill="#22d3ee"/><text x="58" y="168" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">AI副業は着手月から数千〜数万円も</text><circle cx="42" cy="198.6" r="4" fill="#22d3ee"/><text x="58" y="204" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">ブログは平均1,000円・1年収入なし想定</text><circle cx="42" cy="234.2" r="4" fill="#22d3ee"/><text x="58" y="239" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">WEBライティング1文字0.8〜2円</text><circle cx="42" cy="269.8" r="4" fill="#22d3ee"/><text x="58" y="275" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">画像生成1枚1,000〜5,000円</text><rect x="416" y="90" width="352" height="46" rx="10" fill="#f472b6"/><text x="592" y="121" font-size="19" fill="#111c33" font-weight="bold" text-anchor="middle">数字の位置づけ</text><circle cx="426" cy="163" r="4" fill="#f472b6"/><text x="442" y="168" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">筆者の実体験や事例の目安</text><circle cx="426" cy="198.6" r="4" fill="#f472b6"/><text x="442" y="204" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">個人差が大きいと注記</text><circle cx="426" cy="234.2" r="4" fill="#f472b6"/><text x="442" y="239" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">収益保証ではないと明言</text><circle cx="426" cy="269.8" r="4" fill="#f472b6"/><text x="442" y="275" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">条件が揃った場合の上限例</text></svg>