<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 314" width="800" height="314" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" role="img" aria-label="AI生成物の著作権侵害判断"><rect x="1" y="1" width="798" height="312" rx="16" fill="#111c33" stroke="#2b3b5c" stroke-width="2"/><text x="32" y="46" font-size="21" fill="#e2e8f0" font-weight="bold" text-anchor="start">AI生成物の著作権侵害判断</text><rect x="32" y="58" width="56" height="4" rx="2" fill="#22d3ee"/><rect x="32" y="90" width="352" height="46" rx="10" fill="#22d3ee"/><text x="208" y="121" font-size="19" fill="#111c33" font-weight="bold" text-anchor="middle">類似性</text><circle cx="42" cy="163" r="4" fill="#22d3ee"/><text x="58" y="168" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">表現上の本質的な特徴が感得できるか</text><circle cx="42" cy="198.6" r="4" fill="#22d3ee"/><text x="58" y="204" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">AI生成物も人手の創作物と同様に判断</text><circle cx="42" cy="234.2" r="4" fill="#22d3ee"/><text x="58" y="239" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">本質的な特徴は事例ごとに個別判断</text><rect x="416" y="90" width="352" height="46" rx="10" fill="#f472b6"/><text x="592" y="121" font-size="19" fill="#111c33" font-weight="bold" text-anchor="middle">依拠性</text><circle cx="426" cy="163" r="4" fill="#f472b6"/><text x="442" y="168" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">著作物を認識・接触していたと推認できる</text><text x="442" y="190" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">か</text><circle cx="426" cy="220.2" r="4" fill="#f472b6"/><text x="442" y="225" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">学習データに含まれれば通常は依拠性あり</text><circle cx="426" cy="255.79999999999995" r="4" fill="#f472b6"/><text x="442" y="261" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">技術的担保があれば否定の可能性も</text></svg>