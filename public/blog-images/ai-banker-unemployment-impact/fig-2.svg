<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 306" width="800" height="306" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" role="img" aria-label="「銀行員AI失業」の数字が指すもの"><rect x="1" y="1" width="798" height="304" rx="16" fill="#111c33" stroke="#2b3b5c" stroke-width="2"/><text x="32" y="46" font-size="21" fill="#e2e8f0" font-weight="bold" text-anchor="start">「銀行員AI失業」の数字が指すもの</text><rect x="32" y="58" width="56" height="4" rx="2" fill="#22d3ee"/><rect x="32" y="90" width="229" height="190" rx="14" fill="#18264a" stroke="#22d3ee" stroke-width="2"/><text x="147" y="168" font-size="36.66666666666667" fill="#22d3ee" font-weight="bold" text-anchor="middle">1万4000人</text><text x="147" y="217" font-size="15" fill="#94a3b8" font-weight="normal" text-anchor="middle">みずほFGの人員削減目標</text><rect x="285" y="90" width="229" height="190" rx="14" fill="#18264a" stroke="#3b82f6" stroke-width="2"/><text x="400" y="168" font-size="54" fill="#3b82f6" font-weight="bold" text-anchor="middle">46％</text><text x="400" y="221" font-size="15" fill="#94a3b8" font-weight="normal" text-anchor="middle">ゴールドマン Sachs 事務職の</text><text x="400" y="241" font-size="15" fill="#94a3b8" font-weight="normal" text-anchor="middle">自動化可能割合</text><rect x="539" y="90" width="229" height="190" rx="14" fill="#18264a" stroke="#a78bfa" stroke-width="2"/><text x="653" y="168" font-size="54" fill="#a78bfa" font-weight="bold" text-anchor="middle">99％</text><text x="653" y="221" font-size="15" fill="#94a3b8" font-weight="normal" text-anchor="middle">ヤンポルスキー教授の30年失業</text><text x="653" y="241" font-size="15" fill="#94a3b8" font-weight="normal" text-anchor="middle">予測</text></svg>