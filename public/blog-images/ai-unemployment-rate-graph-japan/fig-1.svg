<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 314" width="800" height="314" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" role="img" aria-label="AI失業率グラフと失業率全体の違い"><rect x="1" y="1" width="798" height="312" rx="16" fill="#111c33" stroke="#2b3b5c" stroke-width="2"/><text x="32" y="46" font-size="21" fill="#e2e8f0" font-weight="bold" text-anchor="start">AI失業率グラフと失業率全体の違い</text><rect x="32" y="58" width="56" height="4" rx="2" fill="#22d3ee"/><rect x="32" y="90" width="352" height="46" rx="10" fill="#22d3ee"/><text x="208" y="121" font-size="19" fill="#111c33" font-weight="bold" text-anchor="middle">AI失業率のグラフ</text><circle cx="42" cy="163" r="4" fill="#22d3ee"/><text x="58" y="168" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">AIだけの公式統計は存在しない</text><circle cx="42" cy="198.6" r="4" fill="#22d3ee"/><text x="58" y="204" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">業種別AI利用率と失業率変化幅を組み合わ</text><text x="58" y="225" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">せ</text><circle cx="42" cy="255.79999999999995" r="4" fill="#22d3ee"/><text x="58" y="261" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">期間の取り方で見え方が変わる</text><rect x="416" y="90" width="352" height="46" rx="10" fill="#f472b6"/><text x="592" y="121" font-size="19" fill="#111c33" font-weight="bold" text-anchor="middle">失業率全体</text><circle cx="426" cy="163" r="4" fill="#f472b6"/><text x="442" y="168" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">景気・金利・関税・賃金など複数要因の結</text><text x="442" y="190" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">果</text><circle cx="426" cy="220.2" r="4" fill="#f472b6"/><text x="442" y="225" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">業種ごとのAI利用度とは測る対象が異なる</text></svg>