<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" role="img" aria-label="「なくなる仕事」予測の2つの出どころ"><rect x="1" y="1" width="798" height="348" rx="16" fill="#111c33" stroke="#2b3b5c" stroke-width="2"/><text x="32" y="46" font-size="21" fill="#e2e8f0" font-weight="bold" text-anchor="start">「なくなる仕事」予測の2つの出どころ</text><rect x="32" y="58" width="56" height="4" rx="2" fill="#22d3ee"/><rect x="32" y="90" width="352" height="46" rx="10" fill="#22d3ee"/><text x="208" y="121" font-size="19" fill="#111c33" font-weight="bold" text-anchor="middle">個人の論考（ビル・ゲイツ氏）</text><circle cx="42" cy="163" r="4" fill="#22d3ee"/><text x="58" y="168" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">多くの仕事が永久に消えるとの見通し</text><circle cx="42" cy="198.6" r="4" fill="#22d3ee"/><text x="58" y="204" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">営業・カスタマーサポート・ソフト開発な</text><text x="58" y="225" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">ど</text><circle cx="42" cy="255.79999999999995" r="4" fill="#22d3ee"/><text x="58" y="261" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">2030年ごろロボットと仕事を取り合う想定</text><circle cx="42" cy="291.4" r="4" fill="#22d3ee"/><text x="58" y="296" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">統計的予測とは性格が異なる</text><rect x="416" y="90" width="352" height="46" rx="10" fill="#f472b6"/><text x="592" y="121" font-size="19" fill="#111c33" font-weight="bold" text-anchor="middle">職業紹介メディアの記事</text><circle cx="426" cy="163" r="4" fill="#f472b6"/><text x="442" y="168" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">なくなる可能性が高い15職種を列挙</text><circle cx="426" cy="198.6" r="4" fill="#f472b6"/><text x="442" y="204" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">事務・銀行員・ライター・建設など</text><circle cx="426" cy="234.2" r="4" fill="#f472b6"/><text x="442" y="239" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">全体の何割がなくなるかは示さない</text></svg>