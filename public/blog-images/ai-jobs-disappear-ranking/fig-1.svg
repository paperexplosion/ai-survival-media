<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 328" width="800" height="328" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" role="img" aria-label="AIで仕事がなくなるのではなく仕事内容が変わる"><rect x="1" y="1" width="798" height="326" rx="16" fill="#111c33" stroke="#2b3b5c" stroke-width="2"/><text x="32" y="46" font-size="21" fill="#e2e8f0" font-weight="bold" text-anchor="start">AIで仕事がなくなるのではなく仕事内容が変わる</text><rect x="32" y="58" width="56" height="4" rx="2" fill="#22d3ee"/><rect x="32" y="90" width="352" height="46" rx="10" fill="#22d3ee"/><text x="208" y="121" font-size="19" fill="#111c33" font-weight="bold" text-anchor="middle">自動化と親和的な業務</text><circle cx="42" cy="163" r="4" fill="#22d3ee"/><text x="58" y="168" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">単純作業の繰り返し</text><circle cx="42" cy="198.6" r="4" fill="#22d3ee"/><text x="58" y="204" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">一般事務・データ入力</text><circle cx="42" cy="234.2" r="4" fill="#22d3ee"/><text x="58" y="239" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">レジ係・コールセンター</text><rect x="416" y="90" width="352" height="46" rx="10" fill="#f472b6"/><text x="592" y="121" font-size="19" fill="#111c33" font-weight="bold" text-anchor="middle">人の役割として残りやすい業務</text><circle cx="426" cy="163" r="4" fill="#f472b6"/><text x="442" y="168" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">人にしかできない判断</text><circle cx="426" cy="198.6" r="4" fill="#f472b6"/><text x="442" y="204" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">コミュニケーション</text><circle cx="426" cy="234.2" r="4" fill="#f472b6"/><text x="442" y="239" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">現場対応・対人支援</text><circle cx="426" cy="269.8" r="4" fill="#f472b6"/><text x="442" y="275" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">創造性が求められる仕事</text></svg>