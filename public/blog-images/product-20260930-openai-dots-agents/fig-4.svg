<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" role="img" aria-label="Dots導入前に確認すべき提供条件と承認ルール"><rect x="1" y="1" width="798" height="348" rx="16" fill="#111c33" stroke="#2b3b5c" stroke-width="2"/><text x="32" y="46" font-size="21" fill="#e2e8f0" font-weight="bold" text-anchor="start">Dots導入前に確認すべき提供条件と承認ルール</text><rect x="32" y="58" width="56" height="4" rx="2" fill="#22d3ee"/><rect x="32" y="90" width="352" height="46" rx="10" fill="#22d3ee"/><text x="208" y="121" font-size="19" fill="#111c33" font-weight="bold" text-anchor="middle">提供・料金の不確実性</text><circle cx="42" cy="163" r="4" fill="#22d3ee"/><text x="58" y="168" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">対象地域に日本が含まれるか不明</text><circle cx="42" cy="198.6" r="4" fill="#22d3ee"/><text x="58" y="204" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">EEA・スイス・英国は対象外</text><circle cx="42" cy="234.2" r="4" fill="#22d3ee"/><text x="58" y="239" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">Dots自体の料金記載なし</text><circle cx="42" cy="269.8" r="4" fill="#22d3ee"/><text x="58" y="275" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">追加費用の有無は判断不可</text><rect x="416" y="90" width="352" height="46" rx="10" fill="#f472b6"/><text x="592" y="121" font-size="19" fill="#111c33" font-weight="bold" text-anchor="middle">承認プロセスの仕組み</text><circle cx="426" cy="163" r="4" fill="#f472b6"/><text x="442" y="168" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">Custom Rulesで許可・ブロック・承認必</text><text x="442" y="190" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">須</text><circle cx="426" cy="220.2" r="4" fill="#f472b6"/><text x="442" y="225" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">機微な作業は常に人の承認が必要</text><circle cx="426" cy="255.79999999999995" r="4" fill="#f472b6"/><text x="442" y="261" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">バックグラウンドは読み取り専用</text><circle cx="426" cy="291.4" r="4" fill="#f472b6"/><text x="442" y="296" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">懸念検知で一時停止・停止</text></svg>