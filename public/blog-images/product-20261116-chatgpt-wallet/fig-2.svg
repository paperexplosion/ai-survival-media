<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 336" width="800" height="336" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" role="img" aria-label="カード情報を渡さない仕組みと購入ごとの生体認証"><rect x="1" y="1" width="798" height="334" rx="16" fill="#111c33" stroke="#2b3b5c" stroke-width="2"/><text x="32" y="46" font-size="21" fill="#e2e8f0" font-weight="bold" text-anchor="start">カード情報を渡さない仕組みと購入ごとの生体認証</text><rect x="32" y="58" width="56" height="4" rx="2" fill="#22d3ee"/><rect x="32" y="90" width="352" height="46" rx="10" fill="#22d3ee"/><text x="208" y="121" font-size="19" fill="#111c33" font-weight="bold" text-anchor="middle">決済トークンの仕組み</text><circle cx="42" cy="163" r="4" fill="#22d3ee"/><text x="58" y="168" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">実カード情報は店舗にもエージェントにも</text><text x="58" y="190" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">渡さない</text><circle cx="42" cy="220.2" r="4" fill="#22d3ee"/><text x="58" y="225" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">専用のカード番号・セキュリティコード・</text><text x="58" y="247" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">有効期限を発行</text><circle cx="42" cy="277.4" r="4" fill="#22d3ee"/><text x="58" y="282" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">代金は選んだカードに請求</text><rect x="416" y="90" width="352" height="46" rx="10" fill="#f472b6"/><text x="592" y="121" font-size="19" fill="#111c33" font-weight="bold" text-anchor="middle">購入ごとの生体認証</text><circle cx="426" cy="163" r="4" fill="#f472b6"/><text x="442" y="168" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">承認画面で店舗・商品・金額・カードを確</text><text x="442" y="190" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">認</text><circle cx="426" cy="220.2" r="4" fill="#f472b6"/><text x="442" y="225" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">Face IDやTouch IDで承認</text><circle cx="426" cy="255.79999999999995" r="4" fill="#f472b6"/><text x="442" y="261" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">承認のたびに購入許可の記録が残る</text></svg>