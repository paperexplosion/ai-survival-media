<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 328" width="800" height="328" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" role="img" aria-label="AIが得意な仕事と不得意な仕事の分かれ目"><rect x="1" y="1" width="798" height="326" rx="16" fill="#111c33" stroke="#2b3b5c" stroke-width="2"/><text x="32" y="46" font-size="21" fill="#e2e8f0" font-weight="bold" text-anchor="start">AIが得意な仕事と不得意な仕事の分かれ目</text><rect x="32" y="58" width="56" height="4" rx="2" fill="#22d3ee"/><rect x="32" y="90" width="352" height="46" rx="10" fill="#22d3ee"/><text x="208" y="121" font-size="19" fill="#111c33" font-weight="bold" text-anchor="middle">AIが得意（置き換わりやすい）</text><circle cx="42" cy="163" r="4" fill="#22d3ee"/><text x="58" y="168" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">定型業務・手順が決まった作業</text><circle cx="42" cy="198.6" r="4" fill="#22d3ee"/><text x="58" y="204" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">膨大なデータの高速処理</text><circle cx="42" cy="234.2" r="4" fill="#22d3ee"/><text x="58" y="239" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">過去データを参考にした将来予測</text><circle cx="42" cy="269.8" r="4" fill="#22d3ee"/><text x="58" y="275" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">書類読み取り・定型文の翻訳</text><rect x="416" y="90" width="352" height="46" rx="10" fill="#f472b6"/><text x="592" y="121" font-size="19" fill="#111c33" font-weight="bold" text-anchor="middle">AIが不得意（残りやすい）</text><circle cx="426" cy="163" r="4" fill="#f472b6"/><text x="442" y="168" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">クリエイティブな作業・独自アイデア</text><circle cx="426" cy="198.6" r="4" fill="#f472b6"/><text x="442" y="204" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">相手の気持ちを汲み取る対人業務</text><circle cx="426" cy="234.2" r="4" fill="#f472b6"/><text x="442" y="239" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">複雑な判断や意思決定</text><circle cx="426" cy="269.8" r="4" fill="#f472b6"/><text x="442" y="275" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">身体的なスキルや技術が必要な仕事</text></svg>