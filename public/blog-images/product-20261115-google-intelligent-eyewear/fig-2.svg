<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 328" width="800" height="328" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" role="img" aria-label="カメラ・マイクでできることと制約"><rect x="1" y="1" width="798" height="326" rx="16" fill="#111c33" stroke="#2b3b5c" stroke-width="2"/><text x="32" y="46" font-size="21" fill="#e2e8f0" font-weight="bold" text-anchor="start">カメラ・マイクでできることと制約</text><rect x="32" y="58" width="56" height="4" rx="2" fill="#22d3ee"/><rect x="32" y="90" width="352" height="46" rx="10" fill="#22d3ee"/><text x="208" y="121" font-size="19" fill="#111c33" font-weight="bold" text-anchor="middle">できること</text><circle cx="42" cy="163" r="4" fill="#22d3ee"/><text x="58" y="168" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">ポスターからカレンダー空き確認</text><circle cx="42" cy="198.6" r="4" fill="#22d3ee"/><text x="58" y="204" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">商品を買い物リストに追加</text><circle cx="42" cy="234.2" r="4" fill="#22d3ee"/><text x="58" y="239" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">地図の音声ナビ・70言語翻訳</text><circle cx="42" cy="269.8" r="4" fill="#22d3ee"/><text x="58" y="275" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">ホワイトボード要点をNotes保存</text><rect x="416" y="90" width="352" height="46" rx="10" fill="#f472b6"/><text x="592" y="121" font-size="19" fill="#111c33" font-weight="bold" text-anchor="middle">できないこと・制約</text><circle cx="426" cy="163" r="4" fill="#f472b6"/><text x="442" y="168" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">映像の保存・学習利用は制限</text><circle cx="426" cy="198.6" r="4" fill="#f472b6"/><text x="442" y="204" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">対応端末・米韓の18歳以上に限定</text><circle cx="426" cy="234.2" r="4" fill="#f472b6"/><text x="442" y="239" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">Guided Visionは当初Android専用</text></svg>