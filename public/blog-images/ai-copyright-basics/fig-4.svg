<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" role="img" aria-label="生成AI作品の著作権判断と利用時の確認"><rect x="1" y="1" width="798" height="548" rx="16" fill="#111c33" stroke="#2b3b5c" stroke-width="2"/><text x="32" y="46" font-size="21" fill="#e2e8f0" font-weight="bold" text-anchor="start">生成AI作品の著作権判断と利用時の確認</text><rect x="32" y="58" width="56" height="4" rx="2" fill="#22d3ee"/><rect x="32" y="90" width="736" height="64" rx="12" fill="#18264a" stroke="#22d3ee" stroke-width="2"/><circle cx="72" cy="122" r="18" fill="#22d3ee"/><text x="72" y="129" font-size="20" fill="#111c33" font-weight="bold" text-anchor="middle">1</text><text x="112" y="128" font-size="17" fill="#e2e8f0" font-weight="normal" text-anchor="start">人がどこまで創作に関与したかで判断</text><path d="M400,158 l0,16 m-8,-8 l8,8 l8,-8" stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="32" y="182" width="736" height="64" rx="12" fill="#18264a" stroke="#3b82f6" stroke-width="2"/><circle cx="72" cy="214" r="18" fill="#3b82f6"/><text x="72" y="221" font-size="20" fill="#111c33" font-weight="bold" text-anchor="middle">2</text><text x="112" y="220" font-size="17" fill="#e2e8f0" font-weight="normal" text-anchor="start">AIが自律生成なら著作権は原則発生しない</text><path d="M400,250 l0,16 m-8,-8 l8,8 l8,-8" stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="32" y="274" width="736" height="64" rx="12" fill="#18264a" stroke="#a78bfa" stroke-width="2"/><circle cx="72" cy="306" r="18" fill="#a78bfa"/><text x="72" y="313" font-size="20" fill="#111c33" font-weight="bold" text-anchor="middle">3</text><text x="112" y="312" font-size="17" fill="#e2e8f0" font-weight="normal" text-anchor="start">人が創作的寄与を加えた場合は認められる可能性</text><path d="M400,342 l0,16 m-8,-8 l8,8 l8,-8" stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="32" y="366" width="736" height="64" rx="12" fill="#18264a" stroke="#f472b6" stroke-width="2"/><circle cx="72" cy="398" r="18" fill="#f472b6"/><text x="72" y="405" font-size="20" fill="#111c33" font-weight="bold" text-anchor="middle">4</text><text x="112" y="404" font-size="17" fill="#e2e8f0" font-weight="normal" text-anchor="start">既存の著作物に類似・依拠なら侵害リスク</text><path d="M400,434 l0,16 m-8,-8 l8,8 l8,-8" stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="32" y="458" width="736" height="64" rx="12" fill="#18264a" stroke="#fbbf24" stroke-width="2"/><circle cx="72" cy="490" r="18" fill="#fbbf24"/><text x="72" y="497" font-size="20" fill="#111c33" font-weight="bold" text-anchor="middle">5</text><text x="112" y="496" font-size="17" fill="#e2e8f0" font-weight="normal" text-anchor="start">商用利用時は規約や創作的寄与を確認</text></svg>