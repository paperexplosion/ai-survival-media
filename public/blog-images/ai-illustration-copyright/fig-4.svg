<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" width="800" height="490" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" role="img" aria-label="AIイラストの著作権判断の流れ"><rect x="1" y="1" width="798" height="488" rx="16" fill="#111c33" stroke="#2b3b5c" stroke-width="2"/><text x="32" y="46" font-size="21" fill="#e2e8f0" font-weight="bold" text-anchor="start">AIイラストの著作権判断の流れ</text><rect x="32" y="58" width="56" height="4" rx="2" fill="#22d3ee"/><rect x="32" y="90" width="736" height="80" rx="12" fill="#18264a" stroke="#22d3ee" stroke-width="2"/><circle cx="72" cy="130" r="18" fill="#22d3ee"/><text x="72" y="137" font-size="20" fill="#111c33" font-weight="bold" text-anchor="middle">1</text><text x="112" y="124" font-size="17" fill="#e2e8f0" font-weight="normal" text-anchor="start">AIが自動出力しただけの画像は、人の創作的な関与が乏しく権利が発生しないと説明さ</text><text x="112" y="147" font-size="17" fill="#e2e8f0" font-weight="normal" text-anchor="start">れる</text><path d="M400,174 l0,16 m-8,-8 l8,8 l8,-8" stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="32" y="197.89999999999998" width="736" height="80" rx="12" fill="#18264a" stroke="#3b82f6" stroke-width="2"/><circle cx="72" cy="238" r="18" fill="#3b82f6"/><text x="72" y="245" font-size="20" fill="#111c33" font-weight="bold" text-anchor="middle">2</text><text x="112" y="232" font-size="17" fill="#e2e8f0" font-weight="normal" text-anchor="start">プロンプトを工夫し、生成後の画像を選び修正や加筆を重ねた場合は創作性が認められ得</text><text x="112" y="255" font-size="17" fill="#e2e8f0" font-weight="normal" text-anchor="start">る</text><path d="M400,282 l0,16 m-8,-8 l8,8 l8,-8" stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="32" y="305.79999999999995" width="736" height="64" rx="12" fill="#18264a" stroke="#a78bfa" stroke-width="2"/><circle cx="72" cy="338" r="18" fill="#a78bfa"/><text x="72" y="345" font-size="20" fill="#111c33" font-weight="bold" text-anchor="middle">3</text><text x="112" y="344" font-size="17" fill="#e2e8f0" font-weight="normal" text-anchor="start">AI生成物への著作権付与には、構図やポーズの先取りへの懸念もある</text><path d="M400,374 l0,16 m-8,-8 l8,8 l8,-8" stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="32" y="397.79999999999995" width="736" height="64" rx="12" fill="#18264a" stroke="#f472b6" stroke-width="2"/><circle cx="72" cy="430" r="18" fill="#f472b6"/><text x="72" y="437" font-size="20" fill="#111c33" font-weight="bold" text-anchor="middle">4</text><text x="112" y="436" font-size="17" fill="#e2e8f0" font-weight="normal" text-anchor="start">どのような関与で権利が認められるかは今後の議論に委ねられる</text></svg>