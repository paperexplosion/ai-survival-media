<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 293" width="800" height="293" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" role="img" aria-label="AI失業の結論は割れている"><rect x="1" y="1" width="798" height="291" rx="16" fill="#111c33" stroke="#2b3b5c" stroke-width="2"/><text x="32" y="46" font-size="21" fill="#e2e8f0" font-weight="bold" text-anchor="start">AI失業の結論は割れている</text><rect x="32" y="58" width="56" height="4" rx="2" fill="#22d3ee"/><rect x="32" y="90" width="352" height="46" rx="10" fill="#22d3ee"/><text x="208" y="121" font-size="19" fill="#111c33" font-weight="bold" text-anchor="middle">失業を押し上げた証拠は見えない</text><circle cx="42" cy="163" r="4" fill="#22d3ee"/><text x="58" y="168" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">雇用統計に目立つ形跡なし</text><circle cx="42" cy="198.6" r="4" fill="#22d3ee"/><text x="58" y="204" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">失業率を大きく上昇させた証拠なし</text><circle cx="42" cy="234.2" r="4" fill="#22d3ee"/><text x="58" y="239" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">AIは一部の作業を代替</text><rect x="416" y="90" width="352" height="46" rx="10" fill="#f472b6"/><text x="592" y="121" font-size="19" fill="#111c33" font-weight="bold" text-anchor="middle">削減理由でAIが首位に</text><circle cx="426" cy="163" r="4" fill="#f472b6"/><text x="442" y="168" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">2026年4月に21,490件・26%</text><circle cx="426" cy="198.6" r="4" fill="#f472b6"/><text x="442" y="204" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">累計49,135件で約16%</text><circle cx="426" cy="234.2" r="4" fill="#f472b6"/><text x="442" y="239" font-size="16" fill="#e2e8f0" font-weight="normal" text-anchor="start">22〜25歳の雇用が16%減</text></svg>