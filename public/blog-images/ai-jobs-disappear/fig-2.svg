<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 458" width="800" height="458" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" role="img" aria-label="ランキング数字の成り立ちと崩れる要因"><rect x="1" y="1" width="798" height="456" rx="16" fill="#111c33" stroke="#2b3b5c" stroke-width="2"/><text x="32" y="46" font-size="21" fill="#e2e8f0" font-weight="bold" text-anchor="start">ランキング数字の成り立ちと崩れる要因</text><rect x="32" y="58" width="56" height="4" rx="2" fill="#22d3ee"/><rect x="32" y="90" width="736" height="64" rx="12" fill="#18264a" stroke="#22d3ee" stroke-width="2"/><circle cx="72" cy="122" r="18" fill="#22d3ee"/><text x="72" y="129" font-size="20" fill="#111c33" font-weight="bold" text-anchor="middle">1</text><text x="112" y="128" font-size="17" fill="#e2e8f0" font-weight="normal" text-anchor="start">研究の職業分類と自動化評価から数字を作成</text><path d="M400,158 l0,16 m-8,-8 l8,8 l8,-8" stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="32" y="182" width="736" height="64" rx="12" fill="#18264a" stroke="#3b82f6" stroke-width="2"/><circle cx="72" cy="214" r="18" fill="#3b82f6"/><text x="72" y="221" font-size="20" fill="#111c33" font-weight="bold" text-anchor="middle">2</text><text x="112" y="220" font-size="17" fill="#e2e8f0" font-weight="normal" text-anchor="start">窓口・コールセンターは限りなく0に近づく</text><path d="M400,250 l0,16 m-8,-8 l8,8 l8,-8" stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="32" y="274" width="736" height="64" rx="12" fill="#18264a" stroke="#a78bfa" stroke-width="2"/><circle cx="72" cy="306" r="18" fill="#a78bfa"/><text x="72" y="313" font-size="20" fill="#111c33" font-weight="bold" text-anchor="middle">3</text><text x="112" y="312" font-size="17" fill="#e2e8f0" font-weight="normal" text-anchor="start">特殊ケースはチャットボットが対応できず人がフォロー</text><path d="M400,342 l0,16 m-8,-8 l8,8 l8,-8" stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="32" y="366" width="736" height="64" rx="12" fill="#18264a" stroke="#f472b6" stroke-width="2"/><circle cx="72" cy="398" r="18" fill="#f472b6"/><text x="72" y="405" font-size="20" fill="#111c33" font-weight="bold" text-anchor="middle">4</text><text x="112" y="404" font-size="17" fill="#e2e8f0" font-weight="normal" text-anchor="start">技術の実現時期の前提が変われば数字も変わる</text></svg>